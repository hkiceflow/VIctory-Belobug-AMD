# Workspace dependency version policy: caret (^) semantics with full three-part versions,
# per Rust ecosystem best practices. Cargo.lock pins exact resolved versions for reproducibility.
[workspace]
resolver = "3"
members = ["crates/*", "apps/*", "xtask"]
exclude = ["tests/fixtures"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false
# Added for clearer package metadata (optional but recommended for forks/derivatives).
authors = ["Belobug and VIctory contributors"]
description = "A fork of VIctory focused on running Xbox Series titles natively on Windows with AMD Radeon GPUs."
repository = "https://github.com/Belobug/VIctory-Belobug-AMD"

[workspace.dependencies]
# ── Internal crates ──────────────────────────────────────────────
victory-core = { path = "crates/victory-core" }
victory-pe = { path = "crates/victory-pe" }
victory-loader = { path = "crates/victory-loader" }
victory-hle = { path = "crates/victory-hle" }
victory-gpu = { path = "crates/victory-gpu" }
victory-shader = { path = "crates/victory-shader" }
victory-formats = { path = "crates/victory-formats" }
victory-pipeline = { path = "crates/victory-pipeline" }
victory-game = { path = "crates/victory-game" }

# ── External crates ──────────────────────────────────────────────
anyhow = "1.0.104"
thiserror = "2.0.21"
clap = { version = "4.6.9", features = ["derive"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.2"
object = { version = "0.41.0", default-features = false, features = ["read_core", "pe", "coff", "archive", "std"] }
windows-sys = "0.61.2"
windows = "0.62.2"
windows-core = "0.62.2"
blake3 = "1.8.7"
memchr = "2.8.3"
zlib-rs = { version = "0.6.8", default-features = false, features = ["std"] }
walkdir = "2.5.1"
tempfile = "3.27.0"
opus-pure = "0.2.4"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Temporarily allowed until the newer code is tidied (see upstream comments).
type_complexity = "allow"
needless_range_loop = "allow"
chunks_exact_to_as_chunks = "allow"
sliced_string_as_bytes = "allow"
collapsible_match = "allow"
manual_clamp = "allow"
implicit_saturating_sub = "allow"
min_max = "allow"
undocumented_unsafe_blocks = "allow"

# ── Profiles ─────────────────────────────────────────────────────
[profile.dev]
# Reduce debug-info generation for faster compile times during development.
# Full debug info is rarely needed while iterating on renderer patches.
debug = "line-tables-only"

[profile.dev.package."*"]
# Keep dependencies optimized in debug builds: hashing and parsing are hot paths
# when processing gigabytes of game data (retained from original).
opt-level = 2

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 1
# Strip symbols to reduce binary size on disk (safe for a game compatibility layer
# unless you need symbol-level profiling in release builds).
strip = "symbols"

[profile.diag]
inherits = "release"
lto = false
codegen-units = 16
